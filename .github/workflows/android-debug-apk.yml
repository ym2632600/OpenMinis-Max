name: Android Debug APK

# Builds the OpenMinis-Max Android debug APK end to end: native deps
# (proot + loaders), Alpine sandbox assets, then the Gradle build.
# Release builds use the debug signing config (see BUILDING.md), so the
# debug APK is directly installable.

on:
  push:
    branches: [main]
    paths:
      - 'src/android/**'
      - 'deps/**'
      - 'scripts/prepare_android_sandbox.sh'
      - '.github/workflows/android-debug-apk.yml'
  workflow_dispatch:

# Only the newest push builds: older queued APK runs cancel automatically.
concurrency:
  group: apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: "Checkout (with submodules: deps/proot)"
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK r28c, CMake, platform 36
        run: |
          # ubuntu-latest ships the Android SDK but sdkmanager is not on PATH.
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install \
            "ndk;28.2.13676358" \
            "cmake;3.22.1" \
            "platforms;android-36" \
            "build-tools;36.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Set up Go (for rclone)
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build rclone (gomobile .aar)
        # ANDROID_NDK_HOME was exported to GITHUB_ENV by the NDK step.
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          ./deps/build_rclone_android.sh
          mkdir -p src/android/app/libs
          cp deps/build/rclone/rclone.aar src/android/app/libs/

      - name: Build proot (binary + ELF loaders)
        run: ./deps/build_proot.sh

      - name: Prepare Android sandbox assets (Alpine rootfs)
        run: ./scripts/prepare_android_sandbox.sh

      - name: Use empty provider-customization template
        run: |
          cp src/android/app/provider-customization.properties.example \
             src/android/app/provider-customization.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: src/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Verify proot loaders are in the APK
        run: |
          APK=$(ls src/android/app/build/outputs/apk/debug/*.apk | head -1)
          unzip -l "$APK" | grep -c 'libproot.*\.so'
          unzip -l "$APK" | grep 'libproot'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openminis-max-debug-apk
          path: src/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  # UI smoke: boots an emulator with the APK this run just built, opens the
  # main screens (EN + an Arabic-locale pass) and uploads screenshots as the
  # ui-screenshots artifact. Free on public repos; KVM-enabled ubuntu runner.
  ui-screenshots:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: openminis-max-debug-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch emulator, install APK, capture screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          force-avd-creation: true
          script: bash .github/scripts/ui-smoke.sh

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: shots/
          retention-days: 14
