name: Android Release APK

# Builds the installable APK and attaches it to a GitHub Release.
# Trigger: push a tag like v1.0.0, or run manually (workflow_dispatch
# creates/updates the "latest" release). Release builds use the debug
# signing config (see BUILDING.md), so the APK is directly installable
# on the user's phone with no computer.

on:
  push:
    tags: ['v*', '[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

concurrency:
  group: apk-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: "Checkout (with submodules: deps/proot)"
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK r28c, CMake, platform 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install \
            "ndk;28.2.13676358" \
            "cmake;3.22.1" \
            "platforms;android-36" \
            "build-tools;36.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Set up Go (for rclone)
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build rclone (gomobile .aar)
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          ./deps/build_rclone_android.sh
          mkdir -p src/android/app/libs
          cp deps/build/rclone/rclone.aar src/android/app/libs/

      - name: Build proot (binary + ELF loaders)
        run: ./deps/build_proot.sh

      - name: Prepare Android sandbox assets (Alpine rootfs)
        run: ./scripts/prepare_android_sandbox.sh

      - name: Use empty provider-customization template
        run: |
          cp src/android/app/provider-customization.properties.example \
             src/android/app/provider-customization.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Materialize stable signing key
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_B64" ]; then
            echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/openminis.keystore"
            echo "MINIS_SIGNING_KEYSTORE=$RUNNER_TEMP/openminis.keystore" >> "$GITHUB_ENV"
          fi

      - name: Unit tests (githubDebug)
        working-directory: src/android
        run: |
          chmod +x gradlew
          ./gradlew :app:testGithubDebugUnitTest --no-daemon

      - name: Build APK
        working-directory: src/android
        env:
          MINIS_SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          MINIS_SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          MINIS_SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Verify proot loaders are in the APK
        run: |
          APK=$(ls src/android/app/build/outputs/apk/debug/*.apk | head -1)
          unzip -l "$APK" | grep 'libproot'

      - name: Stage release APK
        run: |
          APK=$(ls src/android/app/build/outputs/apk/debug/*.apk | head -1)
          cp "$APK" OpenMinis-Max.apk
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF_NAME}"; fi
          TAGV="${TAG#v}"
          VCODE=$(grep -oP 'versionCode = \K[0-9]+' src/android/app/build.gradle.kts)
          ASSET="MinisApp-${TAGV}-build${VCODE}-arm64-v8a.apk"
          cp "$APK" "$ASSET"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$ASSET" | grep -m1 "SHA-256"
          echo "ASSET_NAME=$ASSET" >> "$GITHUB_ENV"

      - name: Create GitHub Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF_NAME}"; fi
          TAGV="${TAG#v}"
          gh release create "$TAG" OpenMinis-Max.apk "$ASSET_NAME" \
            --title "OpenMinis-Max $TAG" \
            --notes "Installable OpenMinis-Max APK (built by CI from tag $TAG). Download MinisApp-${TAGV}-build*-arm64-v8a.apk on your phone and tap to install (OpenMinis-Max.apk is the same file). Stable CI signing: updates install in place from here on." \
            || gh release upload "$TAG" OpenMinis-Max.apk "$ASSET_NAME" --clobber
